services:
   db:
      image: ${DATEN_IMAGE:-jhnnsrs/daten:next}
      # Throwaway test DB: trade durability for speed
      command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      environment:
         POSTGRES_MULTIPLE_DATABASES: testdb
         POSTGRES_PASSWORD: test
         POSTGRES_USER: test
      # No host port: docker picks a free one and `backend_stack` asks the running stack which,
      # so parallel suites never collide on a pinned port.
      ports:
        - 5432
   rustfs:
      # Real RustFS, as a deployment runs it: grants are real STS AssumeRole sessions scoped by
      # their inline policy. Buckets are created by `conftest.datalayer`.
      image: rustfs/rustfs:latest
      environment:
         RUSTFS_ACCESS_KEY: datalayerroot
         RUSTFS_SECRET_KEY: datalayerrootsecret
         RUSTFS_VOLUMES: /data
         RUSTFS_ADDRESS: ":9000"
      ports:
        - 9000
