[project]
name = "arkitekt-datalayer"
version = "3.1.0"
description = "S3-backed stores for arkitekt services: bookkeeping rows, scoped upload/read grants, quotas and purge"
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "django>=5.2",
    "django-polymorphic>=4.11.2",
    "authentikate>=6.0.0",
    "kante>=2.4.1",
    "strawberry-graphql>=0.260",
    "pydantic>2,<3",
    "boto3>=1.38.9",
    "duckdb>=1.2.2",
]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "django-types>=0.24.0",
    "dokker>=2.8",
    "psycopg[binary]>=3",
    "pytest>=8",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.11.1",
    "python-semantic-release>=9.21.0",
    "ruff==0.17.6",
    "types-boto3[s3,sts]>=1.38",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "test_project.settings"
asyncio_mode = "auto"

[tool.hatch.build.targets.sdist]
include = ["arkitekt_datalayer"]

[tool.hatch.build.targets.wheel]
include = ["arkitekt_datalayer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
upload_to_pypi = true
branch = "main"
build_command = "uv build"
